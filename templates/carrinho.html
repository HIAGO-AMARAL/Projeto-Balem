<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar pedido</title>

<body>

<div class="container">

    <h1>Finalizar pedido</h1>

    <div class="produto">

        <h2>Brownie Artesanal</h2>

        <p>
            Quantidade: {{ quantidade }}
        </p>

        <p>
            Preço unitário: R$ {{ "%.2f"|format(preco) }}
        </p>

    </div>

    <div class="total">
        Total: R$ {{ "%.2f"|format(total) }}
    </div>

    <form action="/finalizar" method="POST">

        <button type="submit">
            Finalizar pedido
        </button>

    </form>

    <div class="seguro">
        Nenhum dado de pagamento será solicitado.
    </div>

</div>

</body>
</html>
