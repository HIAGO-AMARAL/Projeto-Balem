<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar pedido</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f1eb;
            color: #3e2415;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
        }

        .produto {
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
        }

        .total {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
        }

        button {
            background: #8b4513;
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
        }

        button:hover {
            background: #632f0d;
        }

        .seguro {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Finalizar pedido</h1>

    <div class="produto">

        <h2>Brownie Artesanal</h2>

        <p>
            Quantidade: {{ quantidade }}
        </p>

        <p>
            Preço unitário: R$ {{ "%.2f"|format(preco) }}
        </p>

    </div>

    <div class="total">
        Total: R$ {{ "%.2f"|format(total) }}
    </div>

    <form action="/finalizar" method="POST">

        <button type="submit">
            Finalizar pedido
        </button>

    </form>

    <div class="seguro">
        Nenhum dado de pagamento será solicitado.
    </div>

</div>

</body>
</html>
