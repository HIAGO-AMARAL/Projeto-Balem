<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brownie Artesanal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f1eb;
            color: #3e2415;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .imagem {
            width: 100%;
            height: 300px;
            background: #6b351b;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 80px;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .preco {
            font-size: 35px;
            font-weight: bold;
            color: #8b4513;
            margin: 20px 0;
        }

        input {
            width: 80px;
            padding: 12px;
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            background: #8b4513;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="imagem">
        🍫
    </div>

    <h1>Brownie Artesanal</h1>

    <p>
        Brownie artesanal de chocolate,
        preparado especialmente para você.
    </p>

    <div class="preco">
        R$ 5,00
    </div>

    <form action="/adicionar" method="POST">

        <label>
            Quantidade:
        </label>

        <br>

        <input
            type="number"
            name="quantidade"
            value="1"
            min="1"
            max="10"
        >

        <br>

        <button type="submit">
            Adicionar ao carrinho
        </button>

    </form>

</div>

</body>
</html>
