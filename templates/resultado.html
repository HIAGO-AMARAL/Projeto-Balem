<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Resultados</title>

<body>

<div class="container">

    <h1>Resultados da Simulação</h1>

    <div class="resultados">

        <div class="card">

            <h2>Versão A</h2>

            <p>
                Com vantagem financeira
            </p>

            <div class="taxa">
                {{ taxa_a }}%
            </div>

            <p>
                Acessos: {{ total_a }}
            </p>

            <p>
                Conversões: {{ conversoes_a }}
            </p>

        </div>

        <div class="card">

            <h2>Versão B</h2>

            <p>
                Mensagem neutra
            </p>

            <div class="taxa">
                {{ taxa_b }}%
            </div>

            <p>
                Acessos: {{ total_b }}
            </p>

            <p>
                Conversões: {{ conversoes_b }}
            </p>

        </div>

    </div>

</div>

</body>

</html>
