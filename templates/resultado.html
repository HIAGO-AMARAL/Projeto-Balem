<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Resultados</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
        }

        .resultados {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .taxa {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Resultados da Simulação</h1>

    <div class="resultados">

        <div class="card">

            <h2>Versão A</h2>

            <p>
                Com vantagem financeira
            </p>

            <div class="taxa">
                {{ taxa_a }}%
            </div>

            <p>
                Acessos: {{ total_a }}
            </p>

            <p>
                Conversões: {{ conversoes_a }}
            </p>

        </div>

        <div class="card">

            <h2>Versão B</h2>

            <p>
                Mensagem neutra
            </p>

            <div class="taxa">
                {{ taxa_b }}%
            </div>

            <p>
                Acessos: {{ total_b }}
            </p>

            <p>
                Conversões: {{ conversoes_b }}
            </p>

        </div>

    </div>

</div>

</body>

</html>
